alerts:
  - name: HighLatencyDegradation
    severity: warning
    condition: "p95(latency_ms) > 3000"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: NguyenTrungKien
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: "error_rate_pct > 2.0"
    duration: 2m
    type: symptom-based
    channel: "#llmops-critical"
    owner: NguyenTrungKien
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDrop
    severity: warning
    condition: "retrieval_success_rate_pct < 90.0"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: NguyenTrungKien
    runbook: docs/alerts.md#alert-3
